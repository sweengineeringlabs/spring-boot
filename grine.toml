[workspace]
name = "spring-boot-grine-bootstrap"
members = [
    "buildpack/spring-boot-buildpack-platform",
    "cli/spring-boot-cli",
    "configuration-metadata/spring-boot-configuration-metadata",
    "core/spring-boot-autoconfigure-processor",
    "core/spring-boot",
    "core/spring-boot-autoconfigure",
    "loader/spring-boot-loader",
    "loader/spring-boot-jarmode-tools",
    "loader/spring-boot-loader-tools"
]

[workspace.package]
version = "4.2.0-SNAPSHOT"
group = "org.springframework.boot"

[build]
target_dir = "target/grine"
parallel_jobs = "auto"

[build.compiler]
backend = "javac"

[resolver]
provider = "coursier"
remote_repositories = [
    "https://repo1.maven.org/maven2",
    "https://repo.spring.io/milestone",
    "https://repo.spring.io/snapshot"
]

[[plugins]]
id = "com.grine.archive-resources"
configuration = { module = "spring-boot-loader-tools", archives = [
    { source_module = "spring-boot-loader", output = "META-INF/loader/spring-boot-loader.jar", excludes = ["META-INF/LICENSE.txt", "META-INF/NOTICE.txt", "META-INF/spring-boot.properties"] },
    { source_module = "spring-boot-jarmode-tools", output = "META-INF/jarmode/spring-boot-jarmode-tools.jar" }
] }
