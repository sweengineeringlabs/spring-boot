[workspace]
name = "spring-boot-grine-bootstrap"
members = [
    "configuration-metadata/spring-boot-configuration-metadata",
    "core/spring-boot-autoconfigure-processor",
    "core/spring-boot"
]

[workspace.package]
version = "4.2.0-SNAPSHOT"
group = "org.springframework.boot"

[build]
target_dir = "target/grine"
parallel_jobs = "auto"

[build.compiler]
backend = "javac"

[resolver]
provider = "coursier"
remote_repositories = [
    "https://repo1.maven.org/maven2",
    "https://repo.spring.io/milestone",
    "https://repo.spring.io/snapshot"
]
